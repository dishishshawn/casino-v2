# casino-v2 default research config
# All parameters are research knobs. This is a BACKTEST-ONLY config: no keys,
# no live routing. See README for the staged validation gauntlet these feed.

data:
  # ccxt venue used for public market data (no API keys needed for OHLCV/funding).
  # universe.py falls back across this list if a venue is geo-blocked.
  venues: ["binanceusdm", "bybit", "okx"]
  quote: "USDT"
  timeframe: "1h"            # bar size for signals/backtest
  # Liquid large-cap perp universe, chosen a-priori by market-cap/liquidity (NOT by
  # backtest performance -- picking coins by returns would be selection bias). All
  # are OKX-served (Binance/Bybit are geo-blocked here). Coins listed after `start`
  # begin at their listing date; the ingest forward-probes to find it. Breadth is
  # the honest lever for a momentum book's Sharpe: more independent bets.
  universe: [
    "BTC/USDT:USDT", "ETH/USDT:USDT", "XRP/USDT:USDT", "SOL/USDT:USDT",
    "DOGE/USDT:USDT", "ADA/USDT:USDT", "AVAX/USDT:USDT", "LINK/USDT:USDT",
    "LTC/USDT:USDT", "BCH/USDT:USDT", "DOT/USDT:USDT", "TRX/USDT:USDT",
  ]
  start: "2021-01-01T00:00:00Z"
  end: null                  # null => now
  cache_dir: "data_cache"
  # Externally-supplied delisted symbols to include (survivorship-bias mitigation).
  # ccxt only lists CURRENTLY-LIVE perps; leaving this empty biases momentum upward.
  # Two real, well-documented top-tier delistings inside the 2021-2026 window:
  #  - FTT (FTX Token): Binance/OKX delisted the perp after the Nov-2022 FTX collapse.
  #  - LUNA (Terra): the original token collapsed ~99.99% in May 2022; the LUNA
  #    ticker was later reused by the unrelated Terra 2.0 relaunch (old token
  #    renamed LUNC), so `delisted_symbol_end` below caps the fetch at the
  #    collapse date to avoid splicing two different assets under one symbol.
  # Neither is resolvable via ccxt any more (not in any venue's live market
  # list) -- universe.py falls back to Binance's static klines archive for
  # symbols in this list. NOT an exhaustive fix (a rigorous one needs a paid
  # delisted-coin database) but removes the two largest a-priori omissions.
  delisted_symbols: ["FTT/USDT:USDT", "LUNA/USDT:USDT"]
  delisted_symbol_end:
    "LUNA/USDT:USDT": "2022-05-13T00:00:00Z"

signal:
  # Strategy selector. 'blend' = causal equal-risk (risk-parity) mix of the listed
  # sleeves. The validated GO is momentum + market-neutral carry, risk-parity
  # weighted: it clears the full gauntlet on real OKX 2021->2026 data (DSR ~0.96,
  # PBO 0.23), robustly across blend windows 504-1440h. It is a MARGINAL pass --
  # advance to PAPER TRADING, not capital. (The VRP sleeve was tried and HURTS the
  # blend; kinds 'tsmom'/'carry'/'dn_carry'/'vrp'/'combo' remain for research.)
  kind: "blend"
  sleeves: ["tsmom", "carry"]
  blend_vol_hours: 720      # trailing window for causal equal-risk weighting (~30d)
  combo_carry_weight: 0.5   # (legacy 'combo' kind only)
  # TSMOM on each instrument's own past return. Shorter lookbacks than the equity
  # 12-month, per the brief (crypto momentum favors days-to-weeks). In bars.
  lookbacks_hours: [72, 168, 336, 720]   # ~3d, 7d, 14d, 30d
  vol_lookback_hours: 168                 # vol used to risk-normalize the trend score
  # Long/short symmetric. score in [-1, 1] via tanh of the vol-normalized trend.
  score_cap: 1.0

carry:
  # Funding-carry sleeve: SHORT richly-positive funding to earn it (orthogonal to
  # momentum). a-priori scales, not tuned to returns.
  lookback_hours: 72          # EWMA smoothing of recent funding (persistence)
  carry_ref_annual: 0.30      # annualized funding that maps to a ~0.76 score
  score_cap: 1.0
  market_neutral: true        # cross-sectional dollar-neutral (strips price beta)

vrp:
  # Variance-risk-premium market-timing sleeve (implied DVOL vs realized vol).
  # a-priori windows; the gauntlet's trial grid varies them for honest deflation.
  realized_vol_hours: 168     # trailing realized-vol window (~7d)
  zscore_hours: 720           # window to z-score the premium (~30d)

costs:
  taker_fee_bps: 4.0        # ~2-5 bps on major venues
  half_spread_bps: 1.0      # half the bid/ask spread paid on a market cross
  # Adverse slippage: momentum DEMANDS liquidity in the direction price is moving.
  # Modeled as base + impact * (turnover fraction). Not mid-price fills.
  slippage_base_bps: 1.0
  slippage_impact_bps: 5.0
  # Funding is applied on held notional across funding timestamps.
  funding_interval_hours: 8
  # If exchange funding history is unavailable, assume this constant per-interval rate.
  default_funding_rate: 0.0001   # 0.01% / 8h ~= 10.95% annualized

risk:
  target_annual_vol: 0.12    # modest portfolio vol target (10-15% band)
  vol_forecast_halflife_hours: 72
  kelly_fraction: 0.35       # quarter-to-half Kelly
  # Rebalance cadence: refresh target weights daily and hold in between. TSMOM's
  # edge is on days-to-weeks, so hourly re-trading is pure cost bleed. 24h is an
  # a-priori match to the signal speed (0 or 1 => rebalance every bar).
  rebalance_hours: 24
  max_gross_leverage: 3.0    # effective leverage cap (<=3x per brief)
  max_position_weight: 1.0   # per-instrument gross weight cap (fraction of equity)
  # Correlation-aware total-risk: instruments in the same cluster share a risk budget
  # so highly-correlated BTC/ETH are not sized independently.
  correlation_lookback_hours: 720
  bars_per_year: 8760        # hourly bars

backtest:
  init_cash: 100000.0
  sharpe_haircut: 0.5        # display a ~50%-haircut "believed" Sharpe alongside raw
  oos_holdout_frac: 0.25     # final fraction reserved, untouched during research

execution:
  # Architecture-only. Everything here is INERT until a real broker adapter and a
  # live/testnet data feed are wired on a host you control -- see EXECUTION.md.
  # scripts/run_paper.py only replays the CACHED historical panel through the
  # offline PaperBroker: a dry-run smoke test of the decision pipeline, not a
  # connection to any exchange. No keys are read or required by this section.
  min_trade_notional: 10.0     # skip dust-sized rebalance legs (pure fee bleed)
  killswitch:
    max_drawdown: 0.25         # halt new orders if equity drawdown hits this
    max_stale_bars: 3          # halt if the data feed stops advancing

validation:
  # Purge/embargo for non-IID financial labels (Lopez de Prado).
  label_horizon_bars: 24     # forward horizon of the signal's implicit label
  embargo_frac: 0.01
  # CPCV: N groups, test all combinations of k -> distribution of OOS paths.
  cpcv_n_groups: 8
  cpcv_k_test: 2
  # Honest multiple-testing: number of strategy configs tried (deflates the Sharpe).
  n_trials: 20
  # Go/no-go gate.
  min_deflated_sharpe: 0.0   # DSR must be clearly > 0 (prob > 0.95 handled in code)
  max_pbo: 0.5               # Probability of Backtest Overfitting must be below this
  # Regime windows to stress in walk-forward (inclusive dates).
  regimes:
    - { name: "2021_bull", start: "2021-01-01", end: "2021-11-10" }
    - { name: "2022_bear", start: "2021-11-11", end: "2022-12-31" }
    - { name: "2023_2024_recovery", start: "2023-01-01", end: "2024-12-31" }
    - { name: "2025_incl_oct_cascade", start: "2025-01-01", end: "2025-12-31" }
